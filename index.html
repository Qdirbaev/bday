      <div class="cake-container">
         <div class="cake">
            <div class="plate"></div>
            <div class="layer layer-bottom"></div>
            <div class="layer layer-middle"></div>
            <div class="layer layer-top"></div>
            <div class="icing"></div>
            <div class="drip drip1"></div>
            <div class="drip drip2"></div>
            <div class="drip drip3"></div>
            <div class="candle">
               <div class="flame"></div>
            </div>
         </div>
      </div>

      <div class="close-eyes text-cont">
         <p>Close your eyes and make a wish! (7sec)</p>
      </div>

      <div class="congrats text-cont" style="text-align: center;">
         <p>
            Happy 20th Birthday! Get ready for a year of fun, laughter, and making unforgettable memories!
         </p>
      </div>

      <div class="blowing">
         <p>Now, Blow out the candle!</p>
         <img src="images/blowing.png" alt="blowing" />
      </div>

      <div class="button">
         <button class="btn switch-lights">Switch on lights</button>
         <button class="btn play-music hidden">Let's Play Music</button>
         <button class="btn decoration hidden">Let's Decorate</button>
         <button class="btn let-go hidden">Let The Balloons Go!</button>
         <button class="btn cake-btn hidden">
            The Most Delicious Cake Ever
         </button>
         <button class="btn again hidden">Try Again?</button>
      </div>

      <audio id="background-music" src="music.mp3"></audio>
      <audio id="confetti" src="confetti.mp3"></audio>
      <script src="js.js"></script>
